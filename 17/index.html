<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RC Crop Print</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#d1d5db;overscroll-behavior:none}
*,*:before,*:after{box-sizing:border-box}
button,input,select{font-family:inherit}button{line-height:1}
#app{position:fixed;inset:0;width:100%;height:100dvh;overflow:hidden}
#viewport{position:absolute;inset:0;overflow:hidden;background:#d1d5db;cursor:grab;touch-action:none;user-select:none;overscroll-behavior:none}
#viewport.dragging{cursor:grabbing}
#viewportCanvas{display:block;width:100%;height:100%;touch-action:none}
#topRuler{position:absolute;z-index:20;top:0;left:32px;right:0;height:32px;overflow:hidden;background:#f8fafc;border-bottom:1px solid #cbd5e1;pointer-events:none}
#leftRuler{position:absolute;z-index:20;top:32px;left:0;bottom:0;width:32px;overflow:hidden;background:#f8fafc;border-right:1px solid #cbd5e1;pointer-events:none}
#rulerCorner{position:absolute;z-index:30;top:0;left:0;width:32px;height:32px;background:#f1f5f9;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;pointer-events:none}
#cropModal{position:fixed;z-index:200;inset:0;display:none;flex-direction:column;background:rgba(0,0,0,.86)}
#cropModal.visible{display:flex}
#cropImage{display:block;max-width:100%;max-height:100%}
.crop-image-wrap{width:min(94vw,1100px);height:min(78vh,760px);display:flex;align-items:center;justify-content:center}
.crop-footer{scrollbar-width:none}.crop-footer::-webkit-scrollbar{display:none}
#imageTray{position:absolute;z-index:55;left:50%;bottom:58px;transform:translateX(-50%);max-width:min(92vw,760px);padding:5px;border:1px solid #d1d5db;border-radius:8px;background:rgba(255,255,255,.96);box-shadow:0 10px 25px rgba(0,0,0,.14)}
#thumbnailList{display:flex;align-items:center;gap:5px;max-width:100%;overflow-x:auto;scrollbar-width:none}
#thumbnailList::-webkit-scrollbar{display:none}
.image-thumb{position:relative;flex:0 0 76px;width:76px;height:76px;overflow:hidden;border:1px solid #d1d5db;border-radius:6px;background:#f8fafc}
.image-thumb.active{border-color:#111827;box-shadow:0 0 0 2px #111827}
.image-thumb.hidden-image{opacity:.48}
.image-thumb-preview{display:flex;width:100%;height:100%;align-items:center;justify-content:center;border:0;padding:0;background:#f3f4f6;cursor:pointer}
.image-thumb-preview img,.image-thumb-preview canvas{display:block;width:100%;height:100%;object-fit:contain}
.image-thumb-number{position:absolute;left:3px;top:3px;min-width:16px;height:16px;padding:0 3px;border-radius:4px;background:rgba(17,24,39,.78);color:#fff;font-size:9px;line-height:16px;text-align:center;pointer-events:none}
.image-thumb-action{position:absolute;z-index:2;display:flex;width:18px;height:18px;align-items:center;justify-content:center;border:1px solid #d1d5db;border-radius:4px;padding:0;background:rgba(255,255,255,.94);color:#374151;font-size:11px;line-height:1;cursor:pointer}
.image-thumb-crop{right:41px;bottom:3px}.image-thumb-visibility{right:22px;bottom:3px}.image-thumb-remove{right:3px;bottom:3px;color:#991b1b}
.add-image-thumb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-style:dashed;color:#6b7280;font-size:9px;cursor:pointer}
.add-image-plus{font-size:22px;font-weight:300;line-height:20px}
#imageTrayToggle{display:none}
@media(max-width:700px){
 #layoutPanel{top:84px;right:8px;width:192px}
 .crop-image-wrap{width:96vw;height:72vh}
 #imageTray{bottom:104px;max-width:94vw}
 #imageTray.mobile-hidden{display:none}
 #imageTrayToggle{display:block;position:absolute;z-index:56;left:8px;bottom:104px;height:30px;border:1px solid #d1d5db;border-radius:6px;background:rgba(255,255,255,.96);padding:0 9px;font-size:10px;font-weight:600;box-shadow:0 5px 14px rgba(0,0,0,.12)}
}
</style>
</head>
<body>
<div id="app">
<div id="viewport"><canvas id="viewportCanvas"></canvas></div>
<div id="topRuler"></div><div id="leftRuler"></div><div id="rulerCorner"></div>

<header class="absolute left-10 top-10 z-50 flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white/95 p-1.5 shadow-lg">
  <div class="px-1 text-xs font-semibold max-sm:hidden">RC Crop Print</div>
  <label class="flex h-8 cursor-pointer items-center justify-center rounded-md border border-gray-300 bg-white px-2.5 text-[11px] font-semibold leading-none text-gray-800 hover:bg-gray-100">
    Upload Images
    <input id="sourceInput" type="file" accept="image/jpeg,image/png,image/webp" multiple class="hidden">
  </label>
</header>

<aside id="layoutPanel" class="absolute right-3.5 top-10 z-50 w-48 rounded-lg border border-gray-300 bg-white p-2.5 shadow-xl max-sm:top-[84px] max-sm:right-2">
 <div class="mb-2 flex items-center justify-between">
  <div class="text-xs font-semibold leading-none text-gray-800">Print Layout</div>
  <button id="closeLayoutButton" type="button" class="flex h-6 w-6 items-center justify-center rounded-[5px] border border-gray-300 bg-white p-0 text-sm leading-none text-gray-700 hover:bg-gray-100">×</button>
 </div>
 <div class="mb-1.5">
  <label for="paperSize" class="mb-1 block text-[10px] font-semibold leading-tight text-gray-500">Paper Size</label>
  <select id="paperSize" class="h-7.5 w-full rounded-[5px] border border-gray-300 bg-white px-1.5 text-[10px] leading-none text-gray-700 outline-none">
   <option value="A4">A4</option><option value="4x6">4 × 6</option><option value="5x7">5 × 7</option>
  </select>
 </div>
 <div class="mb-1.5">
  <label class="mb-1 block text-[10px] font-semibold leading-tight text-gray-500">Rows / Columns</label>
  <div class="grid grid-cols-2 gap-1">
   <div class="flex h-7.5 overflow-hidden rounded-[5px] border border-gray-300 bg-white">
    <button id="rowsMinus" type="button" class="w-6 shrink-0 border-r border-gray-200 text-xs">−</button>
    <input id="rows" type="text" inputmode="numeric" autocomplete="off" value="1" class="min-w-0 w-full border-0 px-1 text-center text-[10px] outline-none">
    <button id="rowsPlus" type="button" class="w-6 shrink-0 border-l border-gray-200 text-xs">+</button>
   </div>
   <div class="flex h-7.5 overflow-hidden rounded-[5px] border border-gray-300 bg-white">
    <button id="columnsMinus" type="button" class="w-6 shrink-0 border-r border-gray-200 text-xs">−</button>
    <input id="columns" type="text" inputmode="numeric" autocomplete="off" value="6" class="min-w-0 w-full border-0 px-1 text-center text-[10px] outline-none">
    <button id="columnsPlus" type="button" class="w-6 shrink-0 border-l border-gray-200 text-xs">+</button>
   </div>
  </div>
 </div>
 <div class="mb-1.5">
  <label for="slotColor" class="mb-1 block text-[10px] font-semibold leading-tight text-gray-500">Slot Background</label>
  <div class="flex items-center gap-1.5">
   <input id="slotColor" type="color" value="#ffffff" class="h-7.5 w-8 cursor-pointer rounded-[5px] border border-gray-300 bg-white p-0.5">
   <span id="slotColorText" class="text-[10px] leading-none text-gray-600">#ffffff</span>
  </div>
 </div>
 <div class="mb-1.5">
  <label class="mb-1 block text-[10px] font-semibold leading-tight text-gray-500">Paper Orientation</label>
  <div class="flex gap-1">
   <button id="portraitButton" type="button" class="h-7.5 flex-1 rounded-[5px] border border-gray-900 bg-gray-900 px-1.5 text-[10px] font-medium leading-none text-white">Portrait</button>
   <button id="landscapeButton" type="button" class="h-7.5 flex-1 rounded-[5px] border border-gray-300 bg-white px-1.5 text-[10px] font-medium leading-none text-gray-700">Landscape</button>
  </div>
 </div>
 <div class="mb-1.5">
  <label class="mb-1 block text-[10px] font-semibold leading-tight text-gray-500">Image Orientation</label>
  <button id="rotateImageButton" type="button" class="flex h-7.5 w-full items-center justify-center gap-1 rounded-[5px] border border-gray-300 bg-white px-2 text-[10px] font-semibold leading-none text-gray-700">
   <span>↶</span><span id="rotateText">Rotate −90°</span>
  </button>
 </div>
 <label class="flex items-center justify-between border-t border-gray-200 pt-2 text-[10px] font-semibold text-gray-500">
  <span>Save Settings</span><input id="saveSettingsToggle" type="checkbox" class="accent-gray-900">
 </label>
</aside>

<button id="showLayoutButton" type="button" class="absolute right-3.5 top-10 z-45 hidden h-8 rounded-md border border-gray-300 bg-white px-2.5 text-[11px] font-semibold leading-none text-gray-700 shadow-lg">Layout</button>

<div id="imageTray" class="hidden"><div id="thumbnailList"></div></div>
<button id="imageTrayToggle" type="button">Images</button>

<div id="status" class="pointer-events-none absolute bottom-4 left-10 z-40 rounded-md border border-gray-300 bg-white/95 px-2 py-1.5 text-[10px] leading-none text-gray-600 max-sm:hidden">Upload an image</div>

<div class="absolute bottom-3 left-1/2 z-[60] flex w-[calc(100vw-16px)] max-w-200 -translate-x-1/2 items-center rounded-lg border border-gray-300 bg-white/96 p-1.5 shadow-xl">
 <div class="mx-auto flex items-center gap-1 overflow-x-auto">
  <button id="zoomOut" class="h-8 w-8 shrink-0 rounded-md border border-gray-300 bg-white text-sm">−</button>
  <span id="zoomText" class="min-w-12.5 shrink-0 text-center text-[10px] font-semibold">100%</span>
  <button id="zoomIn" class="h-8 w-8 shrink-0 rounded-md border border-gray-300 bg-white text-sm">+</button>
  <button id="fitButton" class="h-8 shrink-0 rounded-md border border-gray-300 bg-white px-2 text-[10px] font-semibold">Fit</button>
  <button id="actualButton" class="h-8 shrink-0 rounded-md border border-gray-300 bg-white px-2 text-[10px] font-semibold">100%</button>
  <select id="rulerUnit" class="h-8 shrink-0 rounded-md border border-gray-300 bg-white px-1.5 text-[10px] font-semibold"><option value="in">in</option><option value="cm">cm</option><option value="mm">mm</option></select>
  <button id="layoutButton" class="h-8 shrink-0 rounded-md border border-gray-300 bg-white px-2 text-[10px] font-semibold">Layout</button>
 </div>
 <button id="downloadButton" class="ml-1 h-8 shrink-0 rounded-md border border-gray-300 bg-white px-2.5 text-[10px] font-semibold">Download</button>
</div>

<section id="cropModal">
 <header class="flex min-h-14 shrink-0 items-center justify-between bg-black/95 px-3 py-2 text-white">
  <div class="text-xs font-semibold">Crop Image</div>
  <div class="flex items-center gap-1">
   <button id="cropRotateLeft" class="h-8 w-8 rounded-md border border-gray-600 bg-neutral-800 text-sm">↶</button>
   <button id="cropRotateRight" class="h-8 w-8 rounded-md border border-gray-600 bg-neutral-800 text-sm">↷</button>
   <button id="cropCancel" class="h-8 rounded-md border border-gray-600 bg-neutral-800 px-2 text-[10px] font-semibold">Cancel</button>
  </div>
 </header>
 <div class="flex min-h-0 flex-1 items-center justify-center overflow-hidden"><div class="crop-image-wrap"><img id="cropImage" alt="Image to crop"></div></div>
 <footer class="crop-footer flex min-h-14 shrink-0 items-center justify-center gap-1 overflow-x-auto bg-black/95 p-2.5 max-sm:justify-start">
  <button class="ratioButton shrink-0 rounded-md border border-white bg-white px-2.5 py-1.5 text-[10px] font-semibold text-gray-900" data-ratio="0">Free</button>
  <button class="ratioButton shrink-0 rounded-md border border-gray-600 bg-neutral-800 px-2.5 py-1.5 text-[10px] text-white" data-ratio=".6666666667">2:3</button>
  <button class="ratioButton shrink-0 rounded-md border border-gray-600 bg-neutral-800 px-2.5 py-1.5 text-[10px] text-white" data-ratio="1.5">3:2</button>
  <button class="ratioButton shrink-0 rounded-md border border-gray-600 bg-neutral-800 px-2.5 py-1.5 text-[10px] text-white" data-ratio=".8">4:5</button>
  <button class="ratioButton shrink-0 rounded-md border border-gray-600 bg-neutral-800 px-2.5 py-1.5 text-[10px] text-white" data-ratio="1.25">5:4</button>
  <button class="ratioButton shrink-0 rounded-md border border-gray-600 bg-neutral-800 px-2.5 py-1.5 text-[10px] text-white" data-ratio="1">1:1</button>
  <button id="cropApply" class="ml-1.5 shrink-0 rounded-md border border-blue-600 bg-blue-600 px-3 py-1.5 text-[10px] font-semibold text-white">Crop</button>
 </footer>
</section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const viewport=$("viewport"), canvas=$("viewportCanvas"), ctx=canvas.getContext("2d");
const topRuler=$("topRuler"),leftRuler=$("leftRuler"),sourceInput=$("sourceInput");
const layoutPanel=$("layoutPanel"),showLayoutButton=$("showLayoutButton"),closeLayoutButton=$("closeLayoutButton"),layoutButton=$("layoutButton");
const paperSize=$("paperSize"),rowsInput=$("rows"),columnsInput=$("columns"),slotColor=$("slotColor"),slotColorText=$("slotColorText");
const portraitButton=$("portraitButton"),landscapeButton=$("landscapeButton"),rotateImageButton=$("rotateImageButton"),rotateText=$("rotateText");
const zoomText=$("zoomText"),status=$("status"),downloadButton=$("downloadButton"),rulerUnitSelect=$("rulerUnit");
const imageTray=$("imageTray"),thumbnailList=$("thumbnailList"),imageTrayToggle=$("imageTrayToggle"),saveSettingsToggle=$("saveSettingsToggle");
const cropModal=$("cropModal"),cropImage=$("cropImage"),cropApply=$("cropApply"),cropCancel=$("cropCancel"),cropRotateLeft=$("cropRotateLeft"),cropRotateRight=$("cropRotateRight");
const ratioButtons=document.querySelectorAll(".ratioButton");

const DPI=300,BASE_W=360,BASE_H=450,MIN_ZOOM=.05,MAX_ZOOM=8;
const PAPERS={A4:[2480,3505],"4x6":[1200,1800],"5x7":[1500,2100]};
const layout={paper:"A4",landscape:false,slotColor:"#ffffff",gap:40};
const camera={x:0,y:0,zoom:1};
let dpr=devicePixelRatio||1,vw=0,vh=0;
let images=[],activeImageId=null,nextId=1,cropper=null,cropImageId=null,cropObjectUrl=null;
let sheetCanvas=null,hasSheet=false,updateTimer=null,rulerUnit="in",layoutVisible=!matchMedia("(max-width:700px)").matches;
let mouseDragging=false,lastX=0,lastY=0,spacePressed=false;
const pointers=new Map();
let gesture=null;

function small(){return matchMedia("(max-width:700px)").matches}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function active(){return images.find(i=>i.id===activeImageId)||null}
function dims(image=active()){if(!image)return{width:BASE_W,height:BASE_H};return image.rotated?{width:BASE_H,height:BASE_W}:{width:BASE_W,height:BASE_H}}

function updateLayoutUI(){layoutPanel.classList.toggle("hidden",!layoutVisible);showLayoutButton.classList.toggle("hidden",layoutVisible)}
function hideLayout(){layoutVisible=false;updateLayoutUI()}
function showLayout(){layoutVisible=true;updateLayoutUI()}
function canvasInteraction(){if(small()&&layoutVisible)hideLayout()}

function resize(){
 dpr=devicePixelRatio||1;vw=innerWidth;vh=innerHeight;
 canvas.width=vw*dpr;canvas.height=vh*dpr;canvas.style.width=vw+"px";canvas.style.height=vh+"px";render()
}
addEventListener("resize",resize);

function paper(){
 const [w,h]=PAPERS[layout.paper];return layout.landscape?{width:h,height:w}:{width:w,height:h}
}
function getPPU(){return rulerUnit==="cm"?DPI/2.54:rulerUnit==="mm"?DPI/25.4:DPI}
function rulerStep(){const target=80/camera.zoom/getPPU();for(const x of [.01,.02,.05,.1,.2,.25,.5,1,2,5,10,20,50,100,200,500])if(x>=target)return x;return 500}
function fmt(v){return Number(v.toFixed(rulerUnit==="mm"?1:2)).toString()}
function worldToScreen(x,y){return{x:x*camera.zoom+camera.x,y:y*camera.zoom+camera.y}}
function screenToWorld(x,y){return{x:(x-camera.x)/camera.zoom,y:(y-camera.y)/camera.zoom}}
function zoomAt(x,y,z){z=clamp(z,MIN_ZOOM,MAX_ZOOM);const w=screenToWorld(x,y);camera.zoom=z;camera.x=x-w.x*z;camera.y=y-w.y*z;zoomText.textContent=Math.round(z*100)+"%";render()}
function zoomBy(f,x=vw/2,y=vh/2){zoomAt(x,y,camera.zoom*f)}
function fit(){
 if(!sheetCanvas)return;
 const z=Math.min((vw-200)/sheetCanvas.width,(vh-200)/sheetCanvas.height);
 camera.zoom=clamp(z,MIN_ZOOM,MAX_ZOOM);camera.x=(vw-sheetCanvas.width*camera.zoom)/2;camera.y=(vh-sheetCanvas.height*camera.zoom)/2;zoomText.textContent=Math.round(camera.zoom*100)+"%";render()
}
function actual(){
 if(!sheetCanvas)return;
 camera.zoom=1;camera.x=(vw-sheetCanvas.width)/2;camera.y=(vh-sheetCanvas.height)/2;zoomText.textContent="100%";render()
}

function syncActive(){
 const i=active();rowsInput.value=i?i.rows:1;columnsInput.value=i?i.columns:6;updateRotateUI()
}
function makeImage(file){
 return{id:nextId++,file,name:file.name,sourceUrl:URL.createObjectURL(file),croppedCanvas:null,rotated:false,cropRatio:0,rows:1,columns:6,visible:true}
}
function setActive(id){
 if(!images.some(i=>i.id===id))return;
 activeImageId=id;syncActive();renderThumbs();updateStatus();
 if(active()?.croppedCanvas)generateSheet();else{sheetCanvas=null;render()}
}
function renderThumbs(){
 if(images.length<2){imageTray.classList.add("hidden");imageTrayToggle.classList.add("hidden");thumbnailList.replaceChildren();return}
 imageTray.classList.remove("hidden");imageTrayToggle.classList.remove("hidden");thumbnailList.replaceChildren();
 images.forEach((im,index)=>{
  const item=document.createElement("div");item.className="image-thumb"+(im.id===activeImageId?" active":"")+(im.visible?"":" hidden-image");
  const preview=document.createElement("button");preview.className="image-thumb-preview";preview.type="button";
  if(im.croppedCanvas){const c=document.createElement("canvas");c.width=72;c.height=72;const t=c.getContext("2d"),d=dims(im),s=Math.min(68/d.width,68/d.height);t.drawImage(im.croppedCanvas,(72-d.width*s)/2,(72-d.height*s)/2,d.width*s,d.height*s);preview.appendChild(c)}
  else{const img=document.createElement("img");img.src=im.sourceUrl;img.alt=im.name;preview.appendChild(img)}
  preview.onclick=()=>setActive(im.id);
  const n=document.createElement("span");n.className="image-thumb-number";n.textContent=index+1;
  const crop=document.createElement("button");crop.className="image-thumb-action image-thumb-crop";crop.textContent="✎";crop.title="Crop";crop.onclick=e=>{e.stopPropagation();openCrop(im.id)};
  const vis=document.createElement("button");vis.className="image-thumb-action image-thumb-visibility";vis.textContent=im.visible?"◉":"○";vis.title=im.visible?"Hide":"Show";vis.onclick=e=>{e.stopPropagation();im.visible=!im.visible;renderThumbs();generateSheet()};
  const rem=document.createElement("button");rem.className="image-thumb-action image-thumb-remove";rem.textContent="×";rem.title="Remove";rem.onclick=e=>{e.stopPropagation();removeImage(im.id)};
  item.append(preview,n,crop,vis,rem);thumbnailList.appendChild(item)
 });
 const add=document.createElement("label");add.className="image-thumb add-image-thumb";add.innerHTML='<span class="add-image-plus">+</span><span>Add</span>';add.onclick=()=>sourceInput.click();thumbnailList.appendChild(add)
}
function removeImage(id){
 const n=images.findIndex(i=>i.id===id);if(n<0)return;const im=images[n];URL.revokeObjectURL(im.sourceUrl);images.splice(n,1);
 if(cropImageId===id)closeCrop();if(activeImageId===id){const x=images[n]||images[n-1]||images[0];activeImageId=x?x.id:null}
 syncActive();renderThumbs();generateSheet()
}
function updateStatus(){
 const v=images.filter(i=>i.visible&&i.croppedCanvas);
 if(!v.length){status.textContent=images.length?"Crop an image to begin":"Upload an image";return}
 const i=active(),d=dims(i);status.textContent=`${layout.paper} · ${layout.landscape?"Landscape":"Portrait"} · ${v.length} image${v.length>1?"s":""} · Active ${images.indexOf(i)+1} · Image ${d.width}×${d.height} · ${i.rows}×${i.columns} · ${rulerUnit}`
}

function updateRotateUI(){
 const r=active()?.rotated||false;rotateText.textContent=r?"Portrait":"Rotate −90°";
 rotateImageButton.className="flex h-7.5 w-full items-center justify-center gap-1 rounded-[5px] border px-2 text-[10px] font-semibold leading-none "+(r?"border-gray-900 bg-gray-900 text-white":"border-gray-300 bg-white text-gray-700")
}
function rotateImage(){
 const im=active();if(!im?.croppedCanvas)return;
 const old=im.croppedCanvas,n=document.createElement("canvas");n.width=old.height;n.height=old.width;
 const c=n.getContext("2d");c.translate(n.width/2,n.height/2);c.rotate(-Math.PI/2);c.drawImage(old,-old.width/2,-old.height/2);
 im.croppedCanvas=n;im.rotated=!im.rotated;syncActive();renderThumbs();schedule()
}

function openCrop(id){
 const im=images.find(i=>i.id===id);if(!im)return;activeImageId=id;syncActive();renderThumbs();cropImageId=id;cropObjectUrl=im.sourceUrl;cropImage.src=im.sourceUrl;cropModal.classList.add("visible");
 if(cropper){cropper.destroy();cropper=null}
 cropImage.onload=()=>{
  cropper=new Cropper(cropImage,{viewMode:1,dragMode:"move",autoCropArea:.85,responsive:true,restore:false,guides:true,center:true,highlight:true,background:false,movable:true,zoomable:true,rotatable:true,scalable:false,cropBoxMovable:true,cropBoxResizable:true,toggleDragModeOnDblclick:false});
  setRatioUI(im.cropRatio||0);
  if(im.cropRatio!==undefined)cropper.setAspectRatio(im.cropRatio||0);
 }
}
function closeCrop(){cropModal.classList.remove("visible");if(cropper){cropper.destroy();cropper=null}cropImageId=null}
cropCancel.onclick=closeCrop;
sourceInput.onchange=e=>{
 [...e.target.files].forEach(file=>{const im=makeImage(file);images.push(im);if(activeImageId===null)activeImageId=im.id});
 renderThumbs();
 const first=images[images.length-e.target.files.length];if(first)openCrop(first.id);
 e.target.value=""
}
function setRatioUI(r){
 ratioButtons.forEach(b=>{const on=Math.abs(Number(b.dataset.ratio)-r)<1e-7; b.classList.toggle("bg-white",on);b.classList.toggle("text-gray-900",on);b.classList.toggle("bg-neutral-800",!on);b.classList.toggle("text-white",!on);b.classList.toggle("border-white",on);b.classList.toggle("border-gray-600",!on)})
}
ratioButtons.forEach(b=>b.onclick=()=>{const r=Number(b.dataset.ratio);setRatioUI(r);if(cropper){cropper.setAspectRatio(r);const im=images.find(i=>i.id===cropImageId);if(im)im.cropRatio=r}});
cropRotateLeft.onclick=()=>cropper?.rotate(-90);cropRotateRight.onclick=()=>cropper?.rotate(90);
cropApply.onclick=()=>{
 if(!cropper)return;const im=images.find(i=>i.id===cropImageId);if(!im)return;
 im.croppedCanvas=cropper.getCroppedCanvas({width:BASE_W,height:BASE_H,imageSmoothingEnabled:true,imageSmoothingQuality:"high",fillColor:"#fff"});
 im.rotated=false;im.cropRatio=im.cropRatio||0;closeCrop();syncActive();renderThumbs();generateSheet();status.textContent="Crop applied"
}

function drawCell(c,im,x,y,w,h){
 c.fillStyle=layout.slotColor;c.fillRect(x,y,w,h);c.drawImage(im.croppedCanvas,x,y,w,h);c.strokeStyle="#000";c.lineWidth=5;c.strokeRect(x,y,w,h)
}
function generateSheet(){
 const visible=images.filter(i=>i.visible&&i.croppedCanvas);
 if(!visible.length){sheetCanvas=null;hasSheet=false;render();updateStatus();return}
 const old={z:camera.zoom,x:camera.x,y:camera.y},p=paper(),gap=layout.gap,margin=gap/2;
 sheetCanvas=document.createElement("canvas");sheetCanvas.width=p.width;sheetCanvas.height=p.height;const c=sheetCanvas.getContext("2d");
 c.fillStyle="#fff";c.fillRect(0,0,p.width,p.height);
 if(visible.length===1){
  const im=visible[0],d=dims(im);
  for(let r=0;r<im.rows;r++)for(let col=0;col<im.columns;col++){const x=margin+col*(d.width+gap),y=margin+r*(d.height+gap);if(x+d.width<=p.width&&y+d.height<=p.height)drawCell(c,im,x,y,d.width,d.height)}
 }else{
  let cx=margin,cy=margin,rowH=0;
  for(const im of visible){
   const d=dims(im),bw=im.columns*d.width+(im.columns-1)*gap,bh=im.rows*d.height+(im.rows-1)*gap;
   if(cx!==margin&&cx+bw>p.width-margin){cx=margin;cy+=rowH+gap;rowH=0}
   if(cy+bh<=p.height-margin){
    for(let r=0;r<im.rows;r++)for(let col=0;col<im.columns;col++){const x=cx+col*(d.width+gap),y=cy+r*(d.height+gap);drawCell(c,im,x,y,d.width,d.height)}
    cx+=bw+gap;rowH=Math.max(rowH,bh)
   }
  }
 }
 if(!hasSheet){hasSheet=true;fit()}else{camera.zoom=old.z;camera.x=old.x;camera.y=old.y;render()}updateStatus()
}
function schedule(){clearTimeout(updateTimer);updateTimer=setTimeout(generateSheet,120)}

paperSize.onchange=()=>{layout.paper=paperSize.value;schedule()};
slotColor.oninput=()=>{layout.slotColor=slotColor.value;slotColorText.textContent=slotColor.value;schedule()};
portraitButton.onclick=()=>{layout.landscape=false;portraitButton.className="h-7.5 flex-1 rounded-[5px] border border-gray-900 bg-gray-900 px-1.5 text-[10px] text-white";landscapeButton.className="h-7.5 flex-1 rounded-[5px] border border-gray-300 bg-white px-1.5 text-[10px] text-gray-700";schedule()};
landscapeButton.onclick=()=>{layout.landscape=true;landscapeButton.className="h-7.5 flex-1 rounded-[5px] border border-gray-900 bg-gray-900 px-1.5 text-[10px] text-white";portraitButton.className="h-7.5 flex-1 rounded-[5px] border border-gray-300 bg-white px-1.5 text-[10px] text-gray-700";schedule()};
rotateImageButton.onclick=rotateImage;

function commitInput(input,key){
 const im=active();let value=parseInt(input.value,10);
 if(!Number.isFinite(value)||value<1){value=1;input.value="1"}
 else input.value=String(value);
 if(im){im[key]=value}else layout[key]=value;
 schedule();renderThumbs();updateStatus()
}
function editingInput(input,key){
 input.value=input.value.replace(/\D/g,"");
}
function stepInput(input,key,delta){
 let value=parseInt(input.value,10);if(!Number.isFinite(value)||value<1)value=1;value=Math.max(1,value+delta);input.value=String(value);commitInput(input,key)
}
rowsInput.oninput=()=>editingInput(rowsInput,"rows");columnsInput.oninput=()=>editingInput(columnsInput,"columns");
rowsInput.onchange=()=>commitInput(rowsInput,"rows");columnsInput.onchange=()=>commitInput(columnsInput,"columns");
rowsInput.onblur=()=>commitInput(rowsInput,"rows");columnsInput.onblur=()=>commitInput(columnsInput,"columns");
$("rowsMinus").onclick=()=>stepInput(rowsInput,"rows",-1);$("rowsPlus").onclick=()=>stepInput(rowsInput,"rows",1);
$("columnsMinus").onclick=()=>stepInput(columnsInput,"columns",-1);$("columnsPlus").onclick=()=>stepInput(columnsInput,"columns",1);

rulerUnitSelect.onchange=()=>{rulerUnit=rulerUnitSelect.value;persistSettings();render()};
closeLayoutButton.onclick=hideLayout;showLayoutButton.onclick=showLayout;layoutButton.onclick=()=>layoutVisible?hideLayout():showLayout();
imageTrayToggle.onclick=()=>imageTray.classList.toggle("mobile-hidden");

const SETTINGS_KEY="rc-crop-print-general-settings-v3";
let saveSettingsEnabled=false;
function readSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null")}catch{return null}}
function persistSettings(){
 if(!saveSettingsEnabled)return;
 try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({version:3,paper:layout.paper,landscape:layout.landscape,slotColor:layout.slotColor,rulerUnit}))}catch{}
}
const saved=readSettings();if(saved){
 if(PAPERS[saved.paper])layout.paper=saved.paper;
 layout.landscape=!!saved.landscape;
 if(/^#[0-9a-fA-F]{6}$/.test(saved.slotColor||""))layout.slotColor=saved.slotColor;
 if(["in","cm","mm"].includes(saved.rulerUnit))rulerUnit=saved.rulerUnit;
}
saveSettingsEnabled=!!saved;saveSettingsToggle.checked=saveSettingsEnabled;
saveSettingsToggle.onchange=()=>{saveSettingsEnabled=saveSettingsToggle.checked;if(saveSettingsEnabled)persistSettings();else localStorage.removeItem(SETTINGS_KEY)};
paperSize.value=layout.paper;slotColor.value=layout.slotColor;slotColorText.textContent=layout.slotColor;rulerUnitSelect.value=rulerUnit;
paperSize.addEventListener("change",persistSettings);slotColor.addEventListener("input",persistSettings);portraitButton.addEventListener("click",persistSettings);landscapeButton.addEventListener("click",persistSettings);

function drawGrid(){
 const s=32,a=screenToWorld(0,0),b=screenToWorld(vw,vh),sx=Math.floor(a.x/s)*s,ex=Math.ceil(b.x/s)*s,sy=Math.floor(a.y/s)*s,ey=Math.ceil(b.y/s)*s;
 ctx.save();ctx.translate(camera.x,camera.y);ctx.scale(camera.zoom,camera.zoom);ctx.strokeStyle="rgba(100,116,139,.10)";ctx.lineWidth=1/camera.zoom;
 for(let x=sx;x<=ex;x+=s){ctx.beginPath();ctx.moveTo(x,sy);ctx.lineTo(x,ey);ctx.stroke()}
 for(let y=sy;y<=ey;y+=s){ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(ex,y);ctx.stroke()}ctx.restore()
}
function drawSheet(){
 const p=worldToScreen(0,0),w=sheetCanvas.width*camera.zoom,h=sheetCanvas.height*camera.zoom;
 ctx.save();ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=24;ctx.shadowOffsetY=8;ctx.fillStyle="#fff";ctx.fillRect(p.x,p.y,w,h);ctx.shadowColor="transparent";ctx.drawImage(sheetCanvas,p.x,p.y,w,h);ctx.strokeStyle="#9ca3af";ctx.strokeRect(p.x,p.y,w,h);ctx.restore()
}
function rulerTop(){
 const W=vw-32,H=32,c=document.createElement("canvas");c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";const r=c.getContext("2d");r.setTransform(dpr,0,0,dpr,0,0);r.fillStyle="#f8fafc";r.fillRect(0,0,W,H);
 const p=getPPU(),st=rulerStep(),a=screenToWorld(32,0).x/p,b=screenToWorld(vw,0).x/p;r.strokeStyle="#94a3b8";r.fillStyle="#475569";r.font="9px Arial";r.textAlign="center";r.textBaseline="top";
 for(let u=Math.floor(a/st)*st;u<=b;u+=st){const x=worldToScreen(u*p,0).x-32;r.beginPath();r.moveTo(x,32);r.lineTo(x,20);r.stroke();r.fillText(fmt(u),x,3)}
 topRuler.replaceChildren(c)
}
function rulerLeft(){
 const W=32,H=vh-32,c=document.createElement("canvas");c.width=W*dpr;c.height=Math.max(1,H*dpr);c.style.width=W+"px";c.style.height=H+"px";const r=c.getContext("2d");r.setTransform(dpr,0,0,dpr,0,0);r.fillStyle="#f8fafc";r.fillRect(0,0,W,H);
 const p=getPPU(),st=rulerStep(),a=screenToWorld(0,32).y/p,b=screenToWorld(0,vh).y/p;r.strokeStyle="#94a3b8";r.fillStyle="#475569";r.font="9px Arial";r.textBaseline="middle";
 for(let u=Math.floor(a/st)*st;u<=b;u+=st){const y=worldToScreen(0,u*p).y-32;r.beginPath();r.moveTo(32,y);r.lineTo(20,y);r.stroke();r.fillText(fmt(u),3,y)}leftRuler.replaceChildren(c)
}
function render(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);ctx.fillStyle="#d1d5db";ctx.fillRect(0,0,vw,vh);drawGrid();if(sheetCanvas)drawSheet();else{ctx.fillStyle="#64748b";ctx.font="14px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("Upload image(s) to begin",vw/2,vh/2)}rulerTop();rulerLeft()
}

viewport.onmousedown=e=>{canvasInteraction();const can=e.button===1||(e.button===0&&spacePressed);if(!can)return;e.preventDefault();mouseDragging=true;lastX=e.clientX;lastY=e.clientY;viewport.classList.add("dragging")};
addEventListener("mousemove",e=>{if(!mouseDragging)return;camera.x+=e.clientX-lastX;camera.y+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;render()});
addEventListener("mouseup",()=>{mouseDragging=false;viewport.classList.remove("dragging")});
addEventListener("keydown",e=>{if(e.code==="Space"){spacePressed=true;e.preventDefault()}if((e.ctrlKey||e.metaKey)&&["=","+"].includes(e.key)){e.preventDefault();zoomBy(1.2)}if((e.ctrlKey||e.metaKey)&&e.key==="-"){e.preventDefault();zoomBy(1/1.2)}if((e.ctrlKey||e.metaKey)&&e.key==="0"){e.preventDefault();fit()}if((e.ctrlKey||e.metaKey)&&e.key==="1"){e.preventDefault();actual()}});
addEventListener("keyup",e=>{if(e.code==="Space")spacePressed=false});
viewport.addEventListener("wheel",e=>{canvasInteraction();e.preventDefault();const r=viewport.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if(e.ctrlKey||e.metaKey)zoomBy(e.deltaY<0?1.1:1/1.1,x,y);else{camera.x-=e.deltaX;camera.y-=e.deltaY;render()}},{passive:false});
function center(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function touchStart(){const p=[...pointers.values()];if(p.length===1)gesture={mode:"pan",center:{x:p[0].x,y:p[0].y},x:camera.x,y:camera.y};if(p.length===2){const c=center(p[0],p[1]),d=dist(p[0],p[1]),w=screenToWorld(c.x,c.y);gesture={mode:"pinch",d,z:camera.zoom,c,w,x:camera.x,y:camera.y}}}
viewport.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;canvasInteraction();e.preventDefault();viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});touchStart()},{passive:false});
viewport.addEventListener("pointermove",e=>{if(e.pointerType==="mouse")return;const p=pointers.get(e.pointerId);if(!p)return;e.preventDefault();p.x=e.clientX;p.y=e.clientY;const a=[...pointers.values()];if(a.length===1&&gesture?.mode==="pan"){camera.x=gesture.x+a[0].x-gesture.center.x;camera.y=gesture.y+a[0].y-gesture.center.y;render()}else if(a.length===2&&gesture?.mode==="pinch"){const c=center(a[0],a[1]),z=clamp(gesture.z*dist(a[0],a[1])/gesture.d,MIN_ZOOM,MAX_ZOOM);camera.zoom=z;camera.x=c.x-gesture.w.x*z;camera.y=c.y-gesture.w.y*z;zoomText.textContent=Math.round(z*100)+"%";render()}},{passive:false});
function touchEnd(e){if(e.pointerType==="mouse")return;pointers.delete(e.pointerId);if(pointers.size===1)touchStart();else gesture=null}
viewport.addEventListener("pointerup",touchEnd);viewport.addEventListener("pointercancel",touchEnd);

$("zoomIn").onclick=()=>zoomBy(1.2);$("zoomOut").onclick=()=>zoomBy(1/1.2);$("fitButton").onclick=fit;$("actualButton").onclick=actual;
window.addEventListener("keydown",e=>{if(e.code==="Space")spacePressed=true});

const mq=matchMedia("(max-width:700px)");mq.addEventListener("change",e=>{layoutVisible=!e.matches;updateLayoutUI();updateImageTrayUI()});
function updateImageTrayUI(){if(!small())imageTray.classList.remove("mobile-hidden")}

portraitButton.click();updateLayoutUI();syncActive();updateRotateUI();renderThumbs();resize();
</script>
</body>
