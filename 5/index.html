<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
/>

<title>RC Crop Print — Canvas</title>

<style>

/* =========================================================
   RESET
   ========================================================= */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;

  overflow: hidden;

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #d1d5db;
}

body {
  overscroll-behavior: none;
}


/* =========================================================
   APP
   ========================================================= */

#app {
  position: fixed;
  inset: 0;

  width: 100%;
  height: 100dvh;

  overflow: hidden;
}


/* =========================================================
   VIEWPORT
   ========================================================= */

#viewport {
  position: absolute;
  inset: 0;

  overflow: hidden;

  background: #d1d5db;

  touch-action: none;
  user-select: none;

  cursor: grab;
}

#viewport.dragging {
  cursor: grabbing;
}

#viewportCanvas {
  position: absolute;
  inset: 0;

  display: block;

  width: 100%;
  height: 100%;

  touch-action: none;
}


/* =========================================================
   RULERS
   ========================================================= */

#topRuler {
  position: absolute;
  z-index: 20;

  top: 0;
  left: 32px;
  right: 0;

  height: 32px;

  overflow: hidden;

  background: #f8fafc;

  border-bottom: 1px solid #cbd5e1;

  pointer-events: none;
}

#leftRuler {
  position: absolute;
  z-index: 20;

  top: 32px;
  left: 0;
  bottom: 0;

  width: 32px;

  overflow: hidden;

  background: #f8fafc;

  border-right: 1px solid #cbd5e1;

  pointer-events: none;
}

#rulerCorner {
  position: absolute;
  z-index: 30;

  top: 0;
  left: 0;

  width: 32px;
  height: 32px;

  background: #f1f5f9;

  border-right: 1px solid #cbd5e1;
  border-bottom: 1px solid #cbd5e1;

  pointer-events: none;
}


/* =========================================================
   HEADER
   ========================================================= */

.header {
  position: absolute;
  z-index: 50;

  top: 42px;
  left: 42px;

  display: flex;
  align-items: center;
  gap: 8px;

  padding: 7px;

  background: rgba(255, 255, 255, .96);

  border: 1px solid #d1d5db;
  border-radius: 9px;

  box-shadow:
    0 4px 16px rgba(0, 0, 0, .12);
}

.brand {
  padding: 0 5px;

  font-size: 13px;
  font-weight: 700;

  white-space: nowrap;
}


/* =========================================================
   CONTROLS
   ========================================================= */

button,
select,
input {
  font: inherit;
}

button {
  height: 34px;

  padding: 0 10px;

  border: 1px solid #d1d5db;
  border-radius: 7px;

  background: #fff;

  color: #111827;

  font-size: 12px;
  font-weight: 600;

  cursor: pointer;
}

button:hover {
  background: #f3f4f6;
}

button:active {
  transform: translateY(1px);
}


/* =========================================================
   UPLOAD
   ========================================================= */

.upload {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  height: 34px;

  padding: 0 10px;

  border: 1px solid #d1d5db;
  border-radius: 7px;

  background: #fff;

  font-size: 12px;
  font-weight: 600;

  cursor: pointer;
}

#sourceInput {
  display: none;
}


/* =========================================================
   PRINT LAYOUT PANEL
   ========================================================= */

#layoutPanel {
  position: absolute;
  z-index: 50;

  top: 42px;
  right: 14px;

  width: 215px;

  padding: 12px;

  background: rgba(255, 255, 255, .97);

  border: 1px solid #d1d5db;
  border-radius: 10px;

  box-shadow:
    0 5px 20px rgba(0, 0, 0, .14);
}

#layoutPanel.hidden {
  display: none;
}

.panelHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 10px;
}

.panelTitle {
  font-size: 13px;
  font-weight: 700;
}

.closePanel {
  width: 28px;
  height: 28px;

  padding: 0;

  font-size: 16px;
}


/* =========================================================
   FIELDS
   ========================================================= */

.field {
  margin-bottom: 9px;
}

.field label {
  display: block;

  margin-bottom: 4px;

  color: #4b5563;

  font-size: 11px;
  font-weight: 600;
}

.field select,
.field input[type="number"] {
  width: 100%;
  height: 32px;

  padding: 0 8px;

  border: 1px solid #d1d5db;
  border-radius: 6px;

  background: #fff;

  outline: none;

  font-size: 12px;
}

.field select:focus,
.field input[type="number"]:focus {
  border-color: #2563eb;
}

.twoFields {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 7px;
}


/* =========================================================
   ORIENTATION
   ========================================================= */

.orientation {
  display: flex;

  gap: 6px;
}

.orientation button {
  flex: 1;
}

.orientation button.active {
  background: #111827;

  border-color: #111827;

  color: #fff;
}


/* =========================================================
   COLOR
   ========================================================= */

.colorRow {
  display: flex;
  align-items: center;

  gap: 8px;
}

#slotColor {
  width: 38px;
  height: 32px;

  padding: 2px;

  border: 1px solid #d1d5db;
  border-radius: 6px;

  cursor: pointer;
}


/* =========================================================
   SHOW LAYOUT BUTTON
   ========================================================= */

#showLayoutButton {
  position: absolute;
  z-index: 45;

  top: 42px;
  right: 14px;

  display: none;
}

#showLayoutButton.visible {
  display: block;
}


/* =========================================================
   STATUS
   ========================================================= */

#status {
  position: absolute;
  z-index: 40;

  left: 42px;
  bottom: 16px;

  padding: 7px 9px;

  background: rgba(255, 255, 255, .94);

  border: 1px solid #d1d5db;
  border-radius: 7px;

  color: #374151;

  font-size: 11px;

  pointer-events: none;
}


/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar {
  position: absolute;
  z-index: 50;

  left: 50%;
  bottom: 12px;

  transform: translateX(-50%);

  display: flex;
  align-items: center;

  gap: 5px;

  max-width: calc(100vw - 20px);

  padding: 7px;

  background: rgba(255, 255, 255, .96);

  border: 1px solid #d1d5db;
  border-radius: 10px;

  box-shadow:
    0 5px 20px rgba(0, 0, 0, .14);

  overflow-x: auto;

  scrollbar-width: none;
}

.toolbar::-webkit-scrollbar {
  display: none;
}

#zoomText {
  min-width: 54px;

  text-align: center;

  font-size: 12px;
  font-weight: 700;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 700px) {

  .header {
    top: 40px;
    left: 40px;
  }

  .brand {
    display: none;
  }

  #layoutPanel {
    top: 88px;
    right: 10px;

    width: 185px;
  }

  #showLayoutButton {
    top: 40px;
    right: 10px;
  }

  #status {
    display: none;
  }

}

</style>
</head>


<body>

<div id="app">


  <!-- =====================================================
       CANVAS VIEWPORT
       ====================================================== -->

  <div id="viewport">

    <canvas id="viewportCanvas"></canvas>

  </div>


  <!-- =====================================================
       RULERS
       ====================================================== -->

  <div id="topRuler"></div>

  <div id="leftRuler"></div>

  <div id="rulerCorner"></div>


  <!-- =====================================================
       HEADER
       ====================================================== -->

  <header class="header">

    <div class="brand">
      RC Crop Print
    </div>

    <label class="upload">

      Upload Image

      <input
        id="sourceInput"
        type="file"
        accept="image/jpeg,image/png,image/webp"
      >

    </label>

  </header>


  <!-- =====================================================
       SHOW LAYOUT
       ====================================================== -->

  <button id="showLayoutButton">
    Print Layout
  </button>


  <!-- =====================================================
       PRINT LAYOUT PANEL
       ====================================================== -->

  <aside id="layoutPanel">

    <div class="panelHeader">

      <div class="panelTitle">
        Print Layout
      </div>

      <button
        id="closeLayoutButton"
        class="closePanel"
        aria-label="Hide Print Layout"
      >
        ×
      </button>

    </div>


    <!-- Paper -->

    <div class="field">

      <label>
        Paper Size
      </label>

      <select id="paperSize">

        <option value="A4">
          A4
        </option>

        <option value="4x6">
          4 × 6
        </option>

        <option value="5x7">
          5 × 7
        </option>

      </select>

    </div>


    <!-- Rows / Columns -->

    <div class="field">

      <label>
        Rows / Columns
      </label>

      <div class="twoFields">

        <input
          id="rows"
          type="number"
          min="1"
          max="10"
          value="3"
        >

        <input
          id="columns"
          type="number"
          min="1"
          max="10"
          value="2"
        >

      </div>

    </div>


    <!-- Slot color -->

    <div class="field">

      <label>
        Slot Background
      </label>

      <div class="colorRow">

        <input
          id="slotColor"
          type="color"
          value="#ffffff"
        >

        <span id="slotColorText">
          #ffffff
        </span>

      </div>

    </div>


    <!-- Orientation -->

    <div class="field">

      <label>
        Orientation
      </label>

      <div class="orientation">

        <button
          id="portraitButton"
          class="active"
        >
          Portrait
        </button>

        <button
          id="landscapeButton"
        >
          Landscape
        </button>

      </div>

    </div>

  </aside>


  <!-- =====================================================
       STATUS
       ====================================================== -->

  <div id="status">
    Upload an image
  </div>


  <!-- =====================================================
       BOTTOM TOOLBAR
       ====================================================== -->

  <div class="toolbar">

    <button id="zoomOut">
      −
    </button>

    <span id="zoomText">
      100%
    </span>

    <button id="zoomIn">
      +
    </button>

    <button id="fitButton">
      Fit
    </button>

    <button id="actualButton">
      100%
    </button>

    <button id="layoutButton">
      Layout
    </button>

    <button id="downloadButton">
      Download
    </button>

  </div>


</div>


<script>

/* ============================================================
   DOM
   ============================================================ */

const viewport =
  document.getElementById("viewport");

const viewportCanvas =
  document.getElementById("viewportCanvas");

const ctx =
  viewportCanvas.getContext("2d");

const topRuler =
  document.getElementById("topRuler");

const leftRuler =
  document.getElementById("leftRuler");

const sourceInput =
  document.getElementById("sourceInput");

const layoutPanel =
  document.getElementById("layoutPanel");

const showLayoutButton =
  document.getElementById("showLayoutButton");

const closeLayoutButton =
  document.getElementById("closeLayoutButton");

const layoutButton =
  document.getElementById("layoutButton");

const paperSize =
  document.getElementById("paperSize");

const rowsInput =
  document.getElementById("rows");

const columnsInput =
  document.getElementById("columns");

const slotColor =
  document.getElementById("slotColor");

const slotColorText =
  document.getElementById("slotColorText");

const portraitButton =
  document.getElementById("portraitButton");

const landscapeButton =
  document.getElementById("landscapeButton");

const zoomText =
  document.getElementById("zoomText");

const status =
  document.getElementById("status");

const downloadButton =
  document.getElementById("downloadButton");


/* ============================================================
   CONSTANTS
   ============================================================ */

const DPI = 300;

const PHOTO_WIDTH = 360;

const PHOTO_HEIGHT = 450;

const MIN_ZOOM = 0.01;

const MAX_ZOOM = 8;


/* ============================================================
   PAPER SIZES
   ============================================================ */

const PAPER_SIZES = {

  A4: {
    width: 2480,
    height: 3505,

    inchesWidth: 8.267,
    inchesHeight: 11.683
  },

  "4x6": {
    width: 1200,
    height: 1800,

    inchesWidth: 4,
    inchesHeight: 6
  },

  "5x7": {
    width: 1500,
    height: 2100,

    inchesWidth: 5,
    inchesHeight: 7
  }

};


/* ============================================================
   APPLICATION STATE
   ============================================================ */

let dpr =
  window.devicePixelRatio || 1;

let viewportWidth = 0;

let viewportHeight = 0;


/*
 * Original uploaded image.
 */

let sourceImage = null;


/*
 * Cached 360 × 450 crop.
 *
 * This is NOT regenerated when only
 * print-layout values change.
 */

let croppedCanvas = null;


/*
 * Generated print sheet.
 */

let sheetCanvas = null;


/*
 * Layout state.
 */

const layout = {

  paper: "A4",

  rows: 3,

  columns: 2,

  landscape: false,

  slotColor: "#ffffff",

  gap: 40

};


/*
 * Camera state.
 */

const camera = {

  x: 0,

  y: 0,

  zoom: 1

};


/*
 * Used to distinguish the first
 * generated sheet from later updates.
 */

let hasGeneratedSheet = false;


/*
 * Debounce timer.
 */

let sheetUpdateTimer = null;


/* ============================================================
   RESIZE
   ============================================================ */

function resizeViewport() {

  dpr =
    window.devicePixelRatio || 1;

  viewportWidth =
    window.innerWidth;

  viewportHeight =
    window.innerHeight;


  viewportCanvas.width =
    viewportWidth * dpr;

  viewportCanvas.height =
    viewportHeight * dpr;


  viewportCanvas.style.width =
    `${viewportWidth}px`;

  viewportCanvas.style.height =
    `${viewportHeight}px`;


  render();

}


window.addEventListener(
  "resize",
  resizeViewport
);


/* ============================================================
   DEBOUNCED SHEET UPDATE
   ============================================================ */

function scheduleSheetUpdate() {

  /*
   * Cancel previous scheduled generation.
   */

  clearTimeout(
    sheetUpdateTimer
  );


  /*
   * Generate only after the user
   * stops changing values briefly.
   */

  sheetUpdateTimer =
    setTimeout(
      () => {

        sheetUpdateTimer = null;

        generateSheet();

      },
      120
    );

}


/* ============================================================
   COORDINATE CONVERSION
   ============================================================ */

function worldToScreen(
  x,
  y
) {

  return {

    x:
      x * camera.zoom +
      camera.x,

    y:
      y * camera.zoom +
      camera.y

  };

}


function screenToWorld(
  x,
  y
) {

  return {

    x:
      (x - camera.x) /
      camera.zoom,

    y:
      (y - camera.y) /
      camera.zoom

  };

}


/* ============================================================
   UTILITY
   ============================================================ */

function clamp(
  value,
  min,
  max
) {

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


/* ============================================================
   ZOOM
   ============================================================ */

function zoomAt(
  screenX,
  screenY,
  newZoom
) {

  newZoom =
    clamp(
      newZoom,
      MIN_ZOOM,
      MAX_ZOOM
    );


  /*
   * Find the world point currently
   * underneath the cursor/finger.
   */

  const worldPoint =
    screenToWorld(
      screenX,
      screenY
    );


  camera.zoom =
    newZoom;


  /*
   * Keep that world point under
   * the same screen coordinate.
   */

  camera.x =
    screenX -
    worldPoint.x *
      camera.zoom;


  camera.y =
    screenY -
    worldPoint.y *
      camera.zoom;


  updateZoomText();

  render();

}


function zoomBy(
  factor,
  screenX,
  screenY
) {

  zoomAt(

    screenX,

    screenY,

    camera.zoom *
      factor

  );

}


function updateZoomText() {

  zoomText.textContent =
    `${Math.round(
      camera.zoom * 100
    )}%`;

}


/* ============================================================
   PAPER
   ============================================================ */

function getPaper() {

  const base =
    PAPER_SIZES[
      layout.paper
    ];


  if (
    layout.landscape
  ) {

    return {

      width:
        base.height,

      height:
        base.width,

      inchesWidth:
        base.inchesHeight,

      inchesHeight:
        base.inchesWidth

    };

  }


  return base;

}


/* ============================================================
   CREATE 360 × 450 CROP
   ============================================================ */

function createCrop() {

  if (!sourceImage) {
    return;
  }


  const sourceWidth =
    sourceImage.naturalWidth;

  const sourceHeight =
    sourceImage.naturalHeight;


  const targetRatio =
    PHOTO_WIDTH /
    PHOTO_HEIGHT;


  const sourceRatio =
    sourceWidth /
    sourceHeight;


  let cropWidth;

  let cropHeight;

  let cropX;

  let cropY;


  /*
   * Center crop to 4:5.
   */

  if (
    sourceRatio > targetRatio
  ) {

    cropHeight =
      sourceHeight;

    cropWidth =
      sourceHeight *
      targetRatio;

    cropX =
      (
        sourceWidth -
        cropWidth
      ) / 2;

    cropY = 0;

  } else {

    cropWidth =
      sourceWidth;

    cropHeight =
      sourceWidth /
      targetRatio;

    cropX = 0;

    cropY =
      (
        sourceHeight -
        cropHeight
      ) / 2;

  }


  croppedCanvas =
    document.createElement(
      "canvas"
    );


  croppedCanvas.width =
    PHOTO_WIDTH;

  croppedCanvas.height =
    PHOTO_HEIGHT;


  const cropContext =
    croppedCanvas.getContext(
      "2d"
    );


  cropContext.drawImage(

    sourceImage,

    cropX,
    cropY,

    cropWidth,
    cropHeight,

    0,
    0,

    PHOTO_WIDTH,
    PHOTO_HEIGHT

  );

}


/* ============================================================
   GENERATE PRINT SHEET
   ============================================================ */

function generateSheet() {

  if (!croppedCanvas) {
    return;
  }


  /*
   * Remember current camera.
   *
   * Layout changes should NOT
   * unexpectedly reset user's view.
   */

  const previousZoom =
    camera.zoom;

  const previousX =
    camera.x;

  const previousY =
    camera.y;


  const paper =
    getPaper();


  /*
   * Create new sheet canvas.
   */

  sheetCanvas =
    document.createElement(
      "canvas"
    );


  sheetCanvas.width =
    paper.width;

  sheetCanvas.height =
    paper.height;


  const sheetContext =
    sheetCanvas.getContext(
      "2d"
    );


  /*
   * White paper.
   */

  sheetContext.fillStyle =
    "#ffffff";


  sheetContext.fillRect(

    0,
    0,

    paper.width,
    paper.height

  );


  /*
   * Grid spacing.
   */

  const gap =
    layout.gap;


  const margin =
    gap / 2;


  /*
   * Draw repeated photos.
   */

  for (
    let row = 0;
    row < layout.rows;
    row++
  ) {

    for (
      let column = 0;
      column < layout.columns;
      column++
    ) {

      const x =
        margin +
        column *
        (
          PHOTO_WIDTH +
          gap
        );


      const y =
        margin +
        row *
        (
          PHOTO_HEIGHT +
          gap
        );


      /*
       * Do not draw outside
       * the selected paper.
       */

      if (
        x + PHOTO_WIDTH >
          paper.width ||

        y + PHOTO_HEIGHT >
          paper.height
      ) {

        continue;

      }


      /*
       * Slot background.
       */

      sheetContext.fillStyle =
        layout.slotColor;


      sheetContext.fillRect(

        x,
        y,

        PHOTO_WIDTH,
        PHOTO_HEIGHT

      );


      /*
       * Cropped photo.
       */

      sheetContext.drawImage(

        croppedCanvas,

        x,
        y,

        PHOTO_WIDTH,
        PHOTO_HEIGHT

      );


      /*
       * Photo border.
       */

      sheetContext.strokeStyle =
        "#000000";


      sheetContext.lineWidth =
        5;


      sheetContext.strokeRect(

        x,
        y,

        PHOTO_WIDTH,
        PHOTO_HEIGHT

      );

    }

  }


  /*
   * First generation:
   * fit the paper to viewport.
   *
   * Later generations:
   * preserve camera.
   */

  if (!hasGeneratedSheet) {

    hasGeneratedSheet = true;

    fitSheet();

  } else {

    camera.zoom =
      previousZoom;

    camera.x =
      previousX;

    camera.y =
      previousY;

    updateZoomText();

    render();

  }


  updateStatus();

}


/* ============================================================
   FIT SHEET
   ============================================================ */

function fitSheet() {

  if (!sheetCanvas) {
    return;
  }


  const padding = 100;


  const availableWidth =
    viewportWidth -
    padding * 2;


  const availableHeight =
    viewportHeight -
    padding * 2;


  const zoomX =
    availableWidth /
    sheetCanvas.width;


  const zoomY =
    availableHeight /
    sheetCanvas.height;


  camera.zoom =
    clamp(

      Math.min(
        zoomX,
        zoomY
      ),

      MIN_ZOOM,
      MAX_ZOOM

    );


  camera.x =
    (
      viewportWidth -
      sheetCanvas.width *
        camera.zoom
    ) / 2;


  camera.y =
    (
      viewportHeight -
      sheetCanvas.height *
        camera.zoom
    ) / 2;


  updateZoomText();

  render();

}


/* ============================================================
   ACTUAL SIZE
   ============================================================ */

function actualSize() {

  if (!sheetCanvas) {
    return;
  }


  camera.zoom = 1;


  camera.x =
    (
      viewportWidth -
      sheetCanvas.width
    ) / 2;


  camera.y =
    (
      viewportHeight -
      sheetCanvas.height
    ) / 2;


  updateZoomText();

  render();

}


/* ============================================================
   UPLOAD IMAGE
   ============================================================ */

sourceInput.addEventListener(
  "change",
  event => {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    const objectUrl =
      URL.createObjectURL(
        file
      );


    const image =
      new Image();


    image.onload = () => {

      sourceImage =
        image;


      /*
       * Crop only once.
       */

      createCrop();


      /*
       * Generate first print sheet.
       */

      hasGeneratedSheet =
        false;


      generateSheet();


      status.textContent =
        `${image.naturalWidth} × ${image.naturalHeight}px → 360 × 450px`;


      URL.revokeObjectURL(
        objectUrl
      );

    };


    image.src =
      objectUrl;

  }
);


/* ============================================================
   PAPER SIZE
   ============================================================ */

paperSize.addEventListener(
  "change",
  () => {

    layout.paper =
      paperSize.value;


    scheduleSheetUpdate();

  }
);


/* ============================================================
   ROWS
   ============================================================ */

rowsInput.addEventListener(
  "input",
  () => {

    layout.rows =
      clamp(
        Number(
          rowsInput.value
        ) || 1,

        1,
        10
      );


    scheduleSheetUpdate();

  }
);


/* ============================================================
   COLUMNS
   ============================================================ */

columnsInput.addEventListener(
  "input",
  () => {

    layout.columns =
      clamp(
        Number(
          columnsInput.value
        ) || 1,

        1,
        10
      );


    scheduleSheetUpdate();

  }
);

slotColor.addEventListener(

/* ============================================================
   DOWNLOAD
   ============================================================ */

downloadButton.addEventListener(
  "click",
  () => {

    if (!sheetCanvas) {
      return;
    }


    sheetCanvas.toBlob(
      blob => {

        if (!blob) {
          return;
        }


        const url =
          URL.createObjectURL(
            blob
          );


        const link =
          document.createElement(
            "a"
          );


        link.href =
          url;


        link.download =
          `rc-crop-print-${Date.now()}.png`;


        link.click();


        setTimeout(
          () => {

            URL.revokeObjectURL(
              url
            );

          },
          500
        );

      },
      "image/png"
    );

  }
);


/* ============================================================
   MOUSE PAN
   ============================================================ */

let mouseDragging =
  false;

let lastMouseX =
  0;

let lastMouseY =
  0;

let spacePressed =
  false;


window.addEventListener(
  "keydown",
  event => {

    if (
      event.code === "Space"
    ) {

      spacePressed =
        true;

      event.preventDefault();

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    if (
      event.code === "Space"
    ) {

      spacePressed =
        false;

    }

  }
);


viewport.addEventListener(
  "mousedown",
  event => {

    /*
     * Middle mouse
     * OR
     * Space + left mouse.
     */

    const canPan =
      event.button === 1 ||
      (
        event.button === 0 &&
        spacePressed
      );


    if (!canPan) {
      return;
    }


    event.preventDefault();


    mouseDragging =
      true;


    lastMouseX =
      event.clientX;


    lastMouseY =
      event.clientY;


    viewport.classList.add(
      "dragging"
    );

  }
);


window.addEventListener(
  "mousemove",
  event => {

    if (!mouseDragging) {
      return;
    }


    const dx =
      event.clientX -
      lastMouseX;


    const dy =
      event.clientY -
      lastMouseY;


    camera.x +=
      dx;


    camera.y +=
      dy;


    lastMouseX =
      event.clientX;


    lastMouseY =
      event.clientY;


    render();

  }
);


window.addEventListener(
  "mouseup",
  () => {

    mouseDragging =
      false;


    viewport.classList.remove(
      "dragging"
    );

  }
);


/* ============================================================
   MOUSE WHEEL
   ============================================================ */

viewport.addEventListener(
  "wheel",
  event => {

    event.preventDefault();


    const rect =
      viewport.getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    /*
     * Ctrl/Cmd + wheel
     * = zoom.
     */

    if (
      event.ctrlKey ||
      event.metaKey
    ) {

      zoomBy(

        event.deltaY < 0
          ? 1.1
          : 1 / 1.1,

        x,
        y

      );


      return;

    }


    /*
     * Normal wheel
     * = pan.
     */

    camera.x -=
      event.deltaX;


    camera.y -=
      event.deltaY;


    render();

  },
  {
    passive: false
  }
);


/* ============================================================
   TOUCH / POINTER GESTURE ENGINE
   ============================================================ */

const pointers =
  new Map();


let gesture = {

  mode: null,

  startDistance: 0,

  startZoom: 1,

  startCenter: null,

  startCameraX: 0,

  startCameraY: 0,

  startWorldX: 0,

  startWorldY: 0

};


/* ============================================================
   POINTER HELPERS
   ============================================================ */

function getPointers() {

  return [
    ...pointers.values()
  ];

}


function getPointerCenter(
  a,
  b
) {

  return {

    x:
      (
        a.x +
        b.x
      ) / 2,

    y:
      (
        a.y +
        b.y
      ) / 2

  };

}


function getPointerDistance(
  a,
  b
) {

  return Math.hypot(

    b.x - a.x,

    b.y - a.y

  );

}


/* ============================================================
   START TOUCH GESTURE
   ============================================================ */

function startTouchGesture() {

  const points =
    getPointers();


  /*
   * ONE FINGER
   *
   * Start pan.
   */

  if (
    points.length === 1
  ) {

    const point =
      points[0];


    gesture = {

      mode: "pan",

      startDistance: 0,

      startZoom:
        camera.zoom,

      startCenter: {

        x:
          point.x,

        y:
          point.y

      },

      startCameraX:
        camera.x,

      startCameraY:
        camera.y,

      startWorldX: 0,

      startWorldY: 0

    };


    return;

  }


  /*
   * TWO FINGERS
   *
   * Start pinch.
   */

  if (
    points.length === 2
  ) {

    const [a, b] =
      points;


    const center =
      getPointerCenter(
        a,
        b
      );


    const distance =
      getPointerDistance(
        a,
        b
      );


    /*
     * Store the world coordinate
     * underneath the finger midpoint.
     */

    const world =
      screenToWorld(

        center.x,

        center.y

      );


    gesture = {

      mode: "pinch",

      startDistance:
        distance,

      startZoom:
        camera.zoom,

      startCenter:
        center,

      startCameraX:
        camera.x,

      startCameraY:
        camera.y,

      startWorldX:
        world.x,

      startWorldY:
        world.y

    };

  }

}


/* ============================================================
   POINTER DOWN
   ============================================================ */

viewport.addEventListener(
  "pointerdown",
  event => {

    if (
      event.pointerType === "mouse"
    ) {

      return;

    }


    event.preventDefault();


    viewport.setPointerCapture(
      event.pointerId
    );


    pointers.set(
      event.pointerId,
      {

        id:
          event.pointerId,

        x:
          event.clientX,

        y:
          event.clientY

      }
    );


    startTouchGesture();

  },
  {
    passive: false
  }
);


/* ============================================================
   POINTER MOVE
   ============================================================ */

viewport.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerType === "mouse"
    ) {

      return;

    }


    event.preventDefault();


    const pointer =
      pointers.get(
        event.pointerId
      );


    if (!pointer) {
      return;
    }


    pointer.x =
      event.clientX;


    pointer.y =
      event.clientY;


    const points =
      getPointers();


    /*
     * ONE FINGER PAN
     */

    if (
      points.length === 1 &&
      gesture.mode === "pan"
    ) {

      const point =
        points[0];


      camera.x =
        gesture.startCameraX +
        (
          point.x -
          gesture.startCenter.x
        );


      camera.y =
        gesture.startCameraY +
        (
          point.y -
          gesture.startCenter.y
        );


      render();

      return;

    }


    /*
     * TWO FINGER
     *
     * PAN + PINCH ZOOM.
     */

    if (
      points.length === 2 &&
      gesture.mode === "pinch"
    ) {

      const [a, b] =
        points;


      const center =
        getPointerCenter(
          a,
          b
        );


      const distance =
        getPointerDistance(
          a,
          b
        );


      /*
       * Scale relative to original
       * pinch distance.
       */

      const scale =
        distance /
        gesture.startDistance;


      const newZoom =
        clamp(

          gesture.startZoom *
            scale,

          MIN_ZOOM,

          MAX_ZOOM

        );


      camera.zoom =
        newZoom;


      /*
       * Keep the original world point
       * under the current finger center.
       *
       * This gives natural Figma /
       * Photoshop-style pinch behavior.
       */

      camera.x =
        center.x -
        gesture.startWorldX *
          camera.zoom;


      camera.y =
        center.y -
        gesture.startWorldY *
          camera.zoom;


      updateZoomText();

      render();

    }

  },
  {
    passive: false
  }
);


/* ============================================================
   POINTER END
   ============================================================ */

function finishTouchGesture(
  event
) {

  if (
    event.pointerType === "mouse"
  ) {

    return;

  }


  pointers.delete(
    event.pointerId
  );


  /*
   * If one finger remains after
   * a two-finger gesture, switch
   * smoothly to pan.
   */

  if (
    pointers.size === 1
  ) {

    const point =
      getPointers()[0];


    gesture = {

      mode: "pan",

      startDistance: 0,

      startZoom:
        camera.zoom,

      startCenter: {

        x:
          point.x,

        y:
          point.y

      },

      startCameraX:
        camera.x,

      startCameraY:
        camera.y,

      startWorldX: 0,

      startWorldY: 0

    };


    return;

  }


  if (
    pointers.size === 0
  ) {

    gesture.mode =
      null;

  }

}


viewport.addEventListener(
  "pointerup",
  finishTouchGesture
);


viewport.addEventListener(
  "pointercancel",
  finishTouchGesture
);


/* ============================================================
   KEYBOARD SHORTCUTS
   ============================================================ */

window.addEventListener(
  "keydown",
  event => {

    const modifier =
      event.ctrlKey ||
      event.metaKey;


    if (!modifier) {
      return;
    }


    /*
     * Ctrl/Cmd + +
     */

    if (
      event.key === "+" ||
      event.key === "="
    ) {

      event.preventDefault();


      zoomBy(

        1.2,

        viewportWidth / 2,

        viewportHeight / 2

      );

    }


    /*
     * Ctrl/Cmd + -
     */

    if (
      event.key === "-"
    ) {

      event.preventDefault();


      zoomBy(

        1 / 1.2,

        viewportWidth / 2,

        viewportHeight / 2

      );

    }


    /*
     * Ctrl/Cmd + 0
     *
     * Fit.
     */

    if (
      event.key === "0"
    ) {

      event.preventDefault();

      fitSheet();

    }


    /*
     * Ctrl/Cmd + 1
     *
     * Actual size.
     */

    if (
      event.key === "1"
    ) {

      event.preventDefault();

      actualSize();

    }

  }
);


/* ============================================================
   TOOLBAR
   ============================================================ */

document
  .getElementById("zoomIn")
  .addEventListener(
    "click",
    () => {

      zoomBy(

        1.2,

        viewportWidth / 2,

        viewportHeight / 2

      );

    }
  );


document
  .getElementById("zoomOut")
  .addEventListener(
    "click",
    () => {

      zoomBy(

        1 / 1.2,

        viewportWidth / 2,

        viewportHeight / 2

      );

    }
  );


document
  .getElementById("fitButton")
  .addEventListener(
    "click",
    fitSheet
  );


document
  .getElementById("actualButton")
  .addEventListener(
    "click",
    actualSize
  );


/* ============================================================
   DRAW PAPER
   ============================================================ */

function drawSheet() {

  if (!sheetCanvas) {
    return;
  }


  const position =
    worldToScreen(
      0,
      0
    );


  const width =
    sheetCanvas.width *
    camera.zoom;


  const height =
    sheetCanvas.height *
    camera.zoom;


  ctx.save();


  /*
   * Paper shadow.
   */

  ctx.shadowColor =
    "rgba(0,0,0,.25)";

  ctx.shadowBlur =
    24;

  ctx.shadowOffsetY =
    8;


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(

    position.x,

    position.y,

    width,

    height

  );


  ctx.shadowColor =
    "transparent";


  /*
   * Actual print sheet.
   */

  ctx.drawImage(

    sheetCanvas,

    position.x,

    position.y,

    width,

    height

  );


  /*
   * Paper border.
   */

  ctx.strokeStyle =
    "#9ca3af";

  ctx.lineWidth =
    1;


  ctx.strokeRect(

    position.x,

    position.y,

    width,

    height

  );


  ctx.restore();

}


/* ============================================================
   EMPTY STATE
   ============================================================ */

function drawEmptyState() {

  ctx.save();


  ctx.fillStyle =
    "#64748b";


  ctx.font =
    "16px Arial";


  ctx.textAlign =
    "center";


  ctx.textBaseline =
    "middle";


  ctx.fillText(

    "Upload an image to create a print sheet",

    viewportWidth / 2,

    viewportHeight / 2

  );


  ctx.restore();

}


/* ============================================================
   WORKSPACE GRID
   ============================================================ */

function drawWorkspaceGrid() {

  const spacing =
    32;


  const topLeft =
    screenToWorld(
      0,
      0
    );


  const bottomRight =
    screenToWorld(
      viewportWidth,
      viewportHeight
    );


  const startX =
    Math.floor(
      topLeft.x /
      spacing
    ) *
    spacing;


  const endX =
    Math.ceil(
      bottomRight.x /
      spacing
    ) *
    spacing;


  const startY =
    Math.floor(
      topLeft.y /
      spacing
    ) *
    spacing;


  const endY =
    Math.ceil(
      bottomRight.y /
      spacing
    ) *
    spacing;


  ctx.save();


  ctx.translate(
    camera.x,
    camera.y
  );


  ctx.scale(
    camera.zoom,
    camera.zoom
  );


  ctx.strokeStyle =
    "rgba(100,116,139,.10)";


  ctx.lineWidth =
    1 / camera.zoom;


  for (
    let x = startX;
    x <= endX;
    x += spacing
  ) {

    ctx.beginPath();

    ctx.moveTo(
      x,
      startY
    );

    ctx.lineTo(
      x,
      endY
    );

    ctx.stroke();

  }


  for (
    let y = startY;
    y <= endY;
    y += spacing
  ) {

    ctx.beginPath();

    ctx.moveTo(
      startX,
      y
    );

    ctx.lineTo(
      endX,
      y
    );

    ctx.stroke();

  }


  ctx.restore();

}


/* ============================================================
   RULER STEP
   ============================================================ */

function getRulerStep() {

  /*
   * 300 print pixels = 1 inch.
   */

  const targetWorldSpacing =
    85 /
    camera.zoom;


  const candidates = [

    18.75,  // 1/16"
    37.5,   // 1/8"
    75,     // 1/4"
    150,    // 1/2"
    300,    // 1"
    600,    // 2"
    1500,   // 5"
    3000    // 10"

  ];


  for (
    const value of candidates
  ) {

    if (
      value >=
      targetWorldSpacing
    ) {

      return value;

    }

  }


  return 3000;

}


/* ============================================================
   TOP RULER
   ============================================================ */

function drawTopRuler() {

  const width =
    viewportWidth - 32;


  const height =
    32;


  const ruler =
    document.createElement(
      "canvas"
    );


  ruler.width =
    width * dpr;


  ruler.height =
    height * dpr;


  ruler.style.width =
    `${width}px`;


  ruler.style.height =
    `${height}px`;


  const rulerContext =
    ruler.getContext(
      "2d"
    );


  rulerContext.setTransform(

    dpr,
    0,
    0,
    dpr,
    0,
    0

  );


  rulerContext.fillStyle =
    "#f8fafc";


  rulerContext.fillRect(

    0,
    0,

    width,
    height

  );


  const step =
    getRulerStep();


  const start =
    screenToWorld(
      32,
      0
    ).x;


  const end =
    screenToWorld(
      viewportWidth,
      0
    ).x;


  const first =
    Math.floor(
      start /
      step
    ) *
    step;


  rulerContext.strokeStyle =
    "#94a3b8";


  rulerContext.fillStyle =
    "#475569";


  rulerContext.font =
    "9px Arial";


  rulerContext.textAlign =
    "center";


  rulerContext.textBaseline =
    "top";


  for (
    let value = first;
    value <= end;
    value += step
  ) {

    const screen =
      worldToScreen(
        value,
        0
      );


    const x =
      screen.x - 32;


    rulerContext.beginPath();


    rulerContext.moveTo(
      x,
      32
    );


    rulerContext.lineTo(
      x,
      20
    );


    rulerContext.stroke();


    const inches =
      value /
      DPI;


    const label =
      Number.isInteger(
        inches
      )
        ? `${inches}"`
        : `${inches.toFixed(2)}"`;


    rulerContext.fillText(
      label,
      x,
      3
    );

  }


  topRuler.replaceChildren(
    ruler
  );

}


/* ============================================================
   LEFT RULER
   ============================================================ */

function drawLeftRuler() {

  const width =
    32;


  const height =
    viewportHeight - 32;


  const ruler =
    document.createElement(
      "canvas"
    );


  ruler.width =
    width * dpr;


  ruler.height =
    height * dpr;


  ruler.style.width =
    `${width}px`;


  ruler.style.height =
    `${height}px`;


  const rulerContext =
    ruler.getContext(
      "2d"
    );


  rulerContext.setTransform(

    dpr,
    0,
    0,
    dpr,
    0,
    0

  );


  rulerContext.fillStyle =
    "#f8fafc";


  rulerContext.fillRect(

    0,
    0,

    width,
    height

  );


  const step =
    getRulerStep();


  const start =
    screenToWorld(
      0,
      32
    ).y;


  const end =
    screenToWorld(
      0,
      viewportHeight
    ).y;


  const first =
    Math.floor(
      start /
      step
    ) *
    step;


  rulerContext.strokeStyle =
    "#94a3b8";


  rulerContext.fillStyle =
    "#475569";


  rulerContext.font =
    "9px Arial";


  rulerContext.textAlign =
    "left";


  rulerContext.textBaseline =
    "middle";


  for (
    let value = first;
    value <= end;
    value += step
  ) {

    const screen =
      worldToScreen(
        0,
        value
      );


    const y =
      screen.y - 32;


    rulerContext.beginPath();


    rulerContext.moveTo(
      32,
      y
    );


    rulerContext.lineTo(
      20,
      y
    );


    rulerContext.stroke();


    const inches =
      value /
      DPI;


    const label =
      Number.isInteger(
        inches
      )
        ? `${inches}"`
        : `${inches.toFixed(2)}"`;


    rulerContext.fillText(
      label,
      3,
      y
    );

  }


  leftRuler.replaceChildren(
    ruler
  );

}


/* ============================================================
   RULERS
   ============================================================ */

function drawRulers() {

  drawTopRuler();

  drawLeftRuler();

}


/* ============================================================
   MAIN RENDER
   ============================================================ */

function render() {

  /*
   * Use device-pixel-ratio
   * for sharp rendering.
   */

  ctx.setTransform(

    dpr,
    0,
    0,
    dpr,
    0,
    0

  );


  ctx.clearRect(

    0,
    0,

    viewportWidth,
    viewportHeight

  );


  /*
   * Workspace.
   */

  ctx.fillStyle =
    "#d1d5db";


  ctx.fillRect(

    0,
    0,

    viewportWidth,
    viewportHeight

  );


  /*
   * Workspace reference grid.
   */

  drawWorkspaceGrid();


  /*
   * Paper.
   */

  if (sheetCanvas) {

    drawSheet();

  } else {

    drawEmptyState();

  }


  /*
   * Fixed rulers.
   */

  drawRulers();

}


/* ============================================================
   STATUS
   ============================================================ */

function updateStatus() {

  if (!sheetCanvas) {
    return;
  }


  const paper =
    getPaper();


  status.textContent =
    `${layout.paper} · ${
      layout.landscape
        ? "Landscape"
        : "Portrait"
    } · ${
      layout.rows
    } × ${
      layout.columns
    } · ${
      paper.width
    } × ${
      paper.height
    } px`;

}


/* ============================================================
   INITIALIZE
   ============================================================ */

resizeViewport();

</script>
